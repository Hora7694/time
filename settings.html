<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Configurator - DataVault</title>
    <link rel="stylesheet" href="settings.css">
    <style id="local-font-style"></style>
</head>
<body>
    <button id="theme-toggle">🌙</button>

    <div class="main-content">
        <h1>Time Configurator</h1>

        <div class="config-container">
            <div class="settings-column">
                <h2>Text</h2>
                <div class="setting-group">
                    <label>Clock style</label>
                    <select id="clock-style">
                        <option value="1">Style 1: HH:MM:SS</option>
                        <option value="2">Style 2: HHhMM:SS</option>
                        <option value="3">Style 3: HH:MM</option>
                        <option value="4">Style 4: HHhMM</option>
                        <option value="5">Style 5: HHh</option>
                    </select>
                </div>

                <!-- Fuseau horaire 1 -->
                <div class="setting-group">
                    <label>Timezone 1</label>
                    <select id="time-zone-1">
                        <option value="local">Local (Default)</option>
                        <option value="UTC">UTC / GMT</option>
                        <option value="Europe/Paris">Europe / Paris (CET/CEST)</option>
                        <option value="Europe/London">Europe / London (GMT/BST)</option>
                        <option value="America/New_York">America / New York (EST/EDT)</option>
                        <option value="America/Los_Angeles">America / Los Angeles (PST/PDT)</option>
                        <option value="Asia/Tokyo">Asia / Tokyo (JST)</option>
                        <option value="Australia/Sydney">Australia / Sydney (AEST/AEDT)</option>
                    </select>
                </div>

                <!-- Fuseau horaire 2 (Optionnel / Désactivé par défaut) -->
                <div class="setting-group">
                    <label>Timezone 2 (Optional)</label>
                    <select id="time-zone-2">
                        <option value="none">None (Disabled)</option>
                        <option value="local">Local</option>
                        <option value="UTC">UTC / GMT</option>
                        <option value="Europe/Paris">Europe / Paris (CET/CEST)</option>
                        <option value="Europe/London">Europe / London (GMT/BST)</option>
                        <option value="America/New_York">America / New York (EST/EDT)</option>
                        <option value="America/Los_Angeles">America / Los Angeles (PST/PDT)</option>
                        <option value="Asia/Tokyo">Asia / Tokyo (JST)</option>
                        <option value="Australia/Sydney">Australia / Sydney (AEST/AEDT)</option>
                    </select>
                </div>

                <div class="setting-group" style="margin-bottom: 15px;">
                    <label style="display: block; margin-bottom: 5px; font-weight: bold;">Font family</label>
                    <div class="font-search-container" style="position: relative; width: 100%;">
                        
                        <!-- Barre de recherche -->
                        <input type="text" id="font-search" placeholder="Search for a font..." autocomplete="off" style="width: 100%; padding: 10px; border-radius: 5px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-color); box-sizing: border-box;">
                        
                        <!-- Liste déroulante forcée au premier plan -->
                        <div id="font-dropdown-list" style="position: absolute; top: 100%; left: 0; width: 100%; max-height: 200px; overflow-y: auto; background: #ffffff; border: 1px solid #ccc; border-radius: 5px; z-index: 9999; display: none; box-shadow: 0px 4px 6px rgba(0,0,0,0.1); box-sizing: border-box;">
                            <!-- Les éléments vont s'injecter ici -->
                        </div>
                    </div>
                </div>

                <div class="setting-group">
                    <label>Text size (px)</label>
                    <input type="number" id="textSize" value="180">
                </div>

                <h2>Shadow</h2>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div class="setting-group"><label>Shadow X</label><input type="number" id="sh-x" value="5"></div>
                    <div class="setting-group"><label>Shadow Y</label><input type="number" id="sh-y" value="5"></div>
                    <div class="setting-group"><label>Blur (%)</label><input type="number" id="sh-blur" value="25"></div>
                    <div class="setting-group"><label>Opacity (%)</label><input type="number" id="sh-opacity" value="50"></div>
                </div>

                <h2>Color</h2>
                <div style="display: flex; gap: 15px;">
                    <div class="setting-group">
                        <label>Background</label>
                        <input type="color" id="bgColor" value="#00FF00">
                    </div>
                    <div class="setting-group">
                        <label>Font</label>
                        <input type="color" id="textColor" value="#FFFFFF">
                    </div>
                    <div class="setting-group">
                        <label>Shadow</label>
                        <input type="color" id="shadowColor" value="#000000">
                    </div>
                </div>
            </div>

            <div class="preview-column">
                <div id="preview-box">
                    <div id="preview-text">18:47:44</div>
                </div>
                <button class="btn-copy" id="copy-btn" style="margin-bottom: 5px;">Copy the link</button>
                
                <button class="btn-copy" id="toggle-import-btn" style="background-color: transparent; border: 2px solid var(--accent-color); color: var(--accent-color); box-shadow: none; padding: 12px;">Import a configuration</button>
                
                <div id="import-zone" style="width: 100%; display: none; flex-direction: column; gap: 8px; margin-top: 5px;">
                    <input type="text" id="import-url" placeholder="Paste your generated link here..." style="width: 100%; padding: 12px 14px; border-radius: var(--radius-md); border: 1px solid var(--border-color); background: var(--input-bg); color: var(--text-color); font-size: 14px; outline: none;">
                    <button class="btn-copy" id="apply-import-btn" style="padding: 10px; font-size: 14px; border-radius: var(--radius-md);">Apply</button>
                </div>
            </div>
        </div>
    </div>

    <footer style="text-align: center; padding: 40px; border-top: 1px solid #eee; font-size: 0.85em; color: #888; line-height: 1.8;">
        <p>© 2025 <strong>kHorah_</strong> • All rights reserved.</p>
        
        <div style="margin: 20px 0;">
            <script type='text/javascript' src='https://storage.ko-fi.com/cdn/widget/Widget_2.js'></script>
            <script type='text/javascript'>
                kofiwidget2.init('Support the project', '#5553ff', 'T6T117BAZT');
                kofiwidget2.draw();
            </script>
        </div>

        <p>&copy; 2025 &bull; <a href="legal.html" style="color: #5553ff; text-decoration: none;">Legal Notice & Privacy Policy</a></p>
    </footer>
    
    <script>
        const previewText = document.getElementById('preview-text');
        
        // Liste des inputs à écouter pour la mise à jour automatique
        const inputs = ['clock-style', 'time-zone-1', 'time-zone-2', 'bgColor', 'textColor', 'textSize', 'sh-x', 'sh-y', 'sh-blur', 'sh-opacity', 'shadowColor'];

        let availableFonts = [];
        let selectedFont = "Gotham Black"; // Police par défaut si aucune sélectionnée

        function hexToRgba(hex, opacity) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return `rgba(${r}, ${g}, ${b}, ${opacity / 100})`;
        }

        // Fonction auxiliaire pour formater l'heure d'une zone spécifique selon le style choisi
        function getTimeString(now, tz, style) {
            const options = {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            };
            if (tz !== 'local') {
                options.timeZone = tz;
            }

            const formatter = new Intl.DateTimeFormat('fr-FR', options);
            const parts = formatter.formatToParts(now);
            const partMap = {};
            parts.forEach(p => partMap[p.type] = p.value);

            const hours = partMap.hour || "00";
            const minutes = partMap.minute || "00";
            const seconds = partMap.second || "00";

            switch (style) {
                case "1": return `${hours}:${minutes}:${seconds}`;
                case "2": return `${hours}h${minutes}:${seconds}`;
                case "3": return `${hours}:${minutes}`;
                case "4": return `${hours}h${minutes}`;
                case "5": return `${hours}h`;
                default: return `${hours}:${minutes}:${seconds}`;
            }
        }

        function updatePreview() {
            const fontName = selectedFont || 'Gotham Black';
            previewText.style.fontFamily = fontName;
            
            document.getElementById('preview-box').style.backgroundColor = document.getElementById('bgColor').value;
            previewText.style.color = document.getElementById('textColor').value;
            previewText.style.fontSize = (document.getElementById('textSize').value / 3) + "px";
            
            const shadowRGBA = hexToRgba(document.getElementById('shadowColor').value, document.getElementById('sh-opacity').value);
            previewText.style.textShadow = `${document.getElementById('sh-x').value/3}px ${document.getElementById('sh-y').value/3}px ${document.getElementById('sh-blur').value/3}px ${shadowRGBA}`;

            // --- Génération de l'heure dynamique pour l'aperçu ---
            const now = new Date();
            const tz1 = document.getElementById('time-zone-1') ? document.getElementById('time-zone-1').value : 'local';
            const tz2 = document.getElementById('time-zone-2') ? document.getElementById('time-zone-2').value : 'none';
            const currentStyle = document.getElementById('clock-style').value;

            let timeString = getTimeString(now, tz1, currentStyle);

            if (tz2 !== 'none') {
                const timeString2 = getTimeString(now, tz2, currentStyle);
                timeString += ` | ${timeString2}`;
            }

            previewText.textContent = timeString;
        }

        // Attribution des écouteurs d'événements
        inputs.forEach(id => {
            const el = document.getElementById(id);
            if (el) el.addEventListener('input', updatePreview);
        });

        // 1. Liste fixe des polices adaptée pour l'hébergement GitHub Pages
        async function scanFontsFolder() {
            const loadedFonts = [
                { name: "Basic5 Regular", file: "Basic5.ttf" },
                { name: "BBH Sans Hegarty Regular", file: "BBHSansHegarty-Regular.ttf" },
                { name: "BOREX Regular", file: "BOREX-Regular.otf" },
                { name: "BOREX Slant", file: "BOREX-BOREXSlant.otf" },
                { name: "BOREX Variation", file: "BOREX-BOREXVariation.otf" },
                { name: "BOREX Variation Slant", file: "BOREX-BOREXVariationSlant.otf" },
                { name: "Bulbasaur SP", file: "BulbasaurSP.otf" },
                { name: "Dareo Regular", file: "Dareo (OTF).otf" },
                { name: "Gotham Black", file: "Gotham Black Regular.ttf" },
                { name: "Julygo", file: "Julygo.otf" },
                { name: "KyodaAscher Regular", file: "KyodaascherRegular-DOPA1.ttf" },
                { name: "Minecraftia Regular", file: "Minecraftia.ttf" },
                { name: "Minecraft Ten Font Cyrillic", file: "Minecraft-Ten.ttf" },
                { name: "Mojangles", file: "Mojangles.ttf" },
                { name: "Montserrat", file: "Montserrat-VariableFont_wght.ttf" },
                { name: "Octosale", file: "Octosale.ttf" },
                { name: "Orbix Regular", file: "Orbix-Regular.ttf" },
                { name: "Short Pics", file: "Short Pics.ttf" },
                { name: "Showtoon", file: "Showtoon.otf" },
                { name: "Somatic Rounded", file: "Somatic-Rounded.otf" },
                { name: "Super Crumble", file: "Super Crumble.ttf" },
                { name: "Super Fashion", file: "Super Fashion.ttf" },
                { name: "Super Folks", file: "Super Folks.ttf" },
                { name: "Super Mario 256", file: "SuperMario256.ttf" },
                { name: "Super Trend", file: "Super Trend.ttf" },
                { name: "Worktalk", file: "Worktalk.otf" },
                { name: "Yogurt Extra", file: "Yogurt Extra.ttf" }
            ];

            // Tri par ordre alphabétique strict
            availableFonts = loadedFonts.sort((a, b) => a.name.localeCompare(b.name));

            // Injection dynamique des @font-face dans le document
            availableFonts.forEach(font => {
                if (!document.getElementById(`face-${font.name}`)) {
                    const fontFace = document.createElement('style');
                    fontFace.id = `face-${font.name}`;
                    fontFace.textContent = `@font-face { font-family: '${font.name}'; src: url('fonts/${font.file}'); }`;
                    document.head.appendChild(fontFace);
                }
            });

            initFontSearch();
        }

        // 2. Initialisation de la barre de recherche et de l'affichage de la boîte déroulante
        function initFontSearch() {
            const searchInput = document.getElementById('font-search');
            const dropdownList = document.getElementById('font-dropdown-list');

            function renderList(filter = '') {
                dropdownList.innerHTML = '';
                const filtered = availableFonts.filter(f => f.name.toLowerCase().includes(filter.toLowerCase()));

                if (filtered.length === 0) {
                    dropdownList.style.display = 'none';
                    return;
                }

                filtered.forEach(font => {
                    const item = document.createElement('div');
                    item.className = 'font-dropdown-item';
                    item.textContent = font.name;
                    
                    item.style.fontFamily = font.name;
                    item.style.padding = '12px 15px';
                    item.style.cursor = 'pointer';
                    item.style.color = '#333333';
                    item.style.backgroundColor = '#ffffff';
                    item.style.borderBottom = '1px solid #eeeeee';

                    // Gestion du survol
                    item.addEventListener('mouseenter', () => {
                        item.style.backgroundColor = '#5553ff';
                        item.style.color = '#ffffff';
                    });
                    item.addEventListener('mouseleave', () => {
                        item.style.backgroundColor = '#ffffff';
                        item.style.color = '#333333';
                    });

                    // Clic pour assigner la valeur et mettre à jour l'aperçu
                    item.addEventListener('click', () => {
                        searchInput.value = font.name;
                        selectedFont = font.name;
                        dropdownList.style.display = 'none';
                        updatePreview();
                    });

                    dropdownList.appendChild(item);
                });

                dropdownList.style.display = 'block';
            }

            // Événements d'ouverture et de filtrage
            searchInput.addEventListener('focus', () => renderList(searchInput.value));
            searchInput.addEventListener('input', (e) => renderList(e.target.value));

            // Fermeture de la boîte si clic en dehors
            document.addEventListener('click', (e) => {
                if (!e.target.closest('.font-search-container')) {
                    dropdownList.style.display = 'none';
                }
            });
        }

        // Exécution de la structure de copie du lien pour OBS
        document.getElementById('copy-btn').addEventListener('click', function() {
            const p = new URLSearchParams();
            p.append('color', document.getElementById('textColor').value.replace('#',''));
            p.append('bgColor', document.getElementById('bgColor').value.replace('#',''));
            p.append('size', document.getElementById('textSize').value);
            p.append('shadow', `${document.getElementById('sh-x').value}-${document.getElementById('sh-y').value}-${document.getElementById('sh-blur').value}-${document.getElementById('sh-opacity').value}`);
            p.append('shadowColor', document.getElementById('shadowColor').value.replace('#',''));
            p.append('style', document.getElementById('clock-style').value);
            
            const tz1 = document.getElementById('time-zone-1') ? document.getElementById('time-zone-1').value : 'local';
            const tz2 = document.getElementById('time-zone-2') ? document.getElementById('time-zone-2').value : 'none';

            if (tz1 !== 'local') p.append('tz', tz1);
            if (tz2 !== 'none') p.append('tz2', tz2);

            if (selectedFont) p.append('font', selectedFont);

            const finalUrl = `${window.location.origin}/time?${p.toString()}`;
            navigator.clipboard.writeText(finalUrl);
            
            this.textContent = "Link copied!";
            setTimeout(() => this.textContent = "Copy the link", 2000);
        });

        // --- LOGIQUE DE L'IMPORTATEUR DE CONFIGURATION ---
        const toggleImportBtn = document.getElementById('toggle-import-btn');
        const importZone = document.getElementById('import-zone');
        const applyImportBtn = document.getElementById('apply-import-btn');
        const importUrlInput = document.getElementById('import-url');

        // Afficher/Masquer la zone d'import
        toggleImportBtn.addEventListener('click', () => {
            if (importZone.style.display === 'none' || importZone.style.display === '') {
                importZone.style.display = 'flex';
                toggleImportBtn.textContent = 'Cancel';
            } else {
                importZone.style.display = 'none';
                toggleImportBtn.textContent = 'Import a configuration';
                importUrlInput.value = '';
            }
        });

        // Appliquer les paramètres du lien collé
        applyImportBtn.addEventListener('click', () => {
            const urlString = importUrlInput.value.trim();
            if (!urlString) return;

            try {
                const urlObj = new URL(urlString.includes('?') ? urlString : `http://x.com/?${urlString}`);
                const params = urlObj.searchParams;

                // 1. Couleur du texte
                if (params.has('color')) {
                    document.getElementById('textColor').value = `#${params.get('color')}`;
                }
                // 2. Couleur du fond
                if (params.has('bgColor')) {
                    document.getElementById('bgColor').value = `#${params.get('bgColor')}`;
                }
                // 3. Taille du texte
                if (params.has('size')) {
                    document.getElementById('textSize').value = params.get('size');
                }
                // 4. Style de l'horloge
                if (params.has('style')) {
                    document.getElementById('clock-style').value = params.get('style');
                }
                // 5. Fuseau horaire 1
                if (params.has('tz')) {
                    const tzVal = params.get('tz');
                    const tzSelect1 = document.getElementById('time-zone-1');
                    if (tzSelect1) tzSelect1.value = tzVal;
                } else if (document.getElementById('time-zone-1')) {
                    document.getElementById('time-zone-1').value = 'local';
                }
                // 5b. Fuseau horaire 2
                if (params.has('tz2')) {
                    const tz2Val = params.get('tz2');
                    const tzSelect2 = document.getElementById('time-zone-2');
                    if (tzSelect2) tzSelect2.value = tz2Val;
                } else if (document.getElementById('time-zone-2')) {
                    document.getElementById('time-zone-2').value = 'none';
                }
                // 6. Couleur de l'ombre
                if (params.has('shadowColor')) {
                    document.getElementById('shadowColor').value = `#${params.get('shadowColor')}`;
                }
                // 7. Paramètres de l'ombre (X-Y-Blur-Opacity)
                if (params.has('shadow')) {
                    const shadowParts = params.get('shadow').split('-');
                    if (shadowParts.length >= 4) {
                        document.getElementById('sh-x').value = shadowParts[0];
                        document.getElementById('sh-y').value = shadowParts[1];
                        document.getElementById('sh-blur').value = shadowParts[2];
                        document.getElementById('sh-opacity').value = shadowParts[3];
                    }
                }
                // 8. Sélection de la police
                if (params.has('font')) {
                    const fontName = decodeURIComponent(params.get('font')).replace(/\+/g, ' ');
                    const found = availableFonts.find(f => f.name.toLowerCase() === fontName.toLowerCase());
                    if (found) {
                        selectedFont = found.name;
                        document.getElementById('font-search').value = found.name;
                    }
                }

                // Forcer la mise à jour immédiate de l'aperçu graphique
                updatePreview();

                // Reset et fermeture de la fenêtre d'import avec succès
                importZone.style.display = 'none';
                toggleImportBtn.textContent = 'Import a configuration';
                importUrlInput.value = '';
                
            } catch (e) {
                alert('Invalid URL or link format.');
                console.error(e);
            }
        });

        // Toggle Dark/Light Mode
        const btn = document.getElementById('theme-toggle');
        if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-mode');
        btn.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            localStorage.setItem('theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
        });

        // Initialisation de la boucle de rafraîchissement
        window.addEventListener('DOMContentLoaded', scanFontsFolder);
        setInterval(updatePreview, 1000);
        updatePreview();
        document.getElementById('font-search').value = selectedFont;
    </script>
</body>
</html>
